packages:
  - .

allowBuilds:
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  sharp: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - "@react-router/dev@8.5.0"
  - "@react-router/express@8.5.0"
  - "@react-router/node@8.5.0"
  - "@react-router/serve@8.5.0"
  - react-router@8.5.0

onlyBuiltDependencies:
  - bcrypt
  - better-sqlite3
  - esbuild
  - sharp

# Satori pins 0.7.3; use the security fix within the same minor version.
overrides:
  "fflate@>=0.7.0 <0.7.5": "0.7.5"
