packages:
  - .

allowBuilds:
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  sharp: true
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@react-router/dev@8.4.0'
  - '@react-router/express@8.4.0'
  - '@react-router/node@8.4.0'
  - '@react-router/serve@8.4.0'
  - react-router@8.4.0

onlyBuiltDependencies:
  - bcrypt
  - better-sqlite3
  - esbuild
  - sharp

# Code Mode 1.18.4 pins an Effect beta; its patch adapts the renamed stable APIs.
overrides:
  '@opencode-ai/codemode>effect': '4.0.2'

patchedDependencies:
  '@opencode-ai/codemode@1.18.4': patches/@opencode-ai__codemode@1.18.4.patch
