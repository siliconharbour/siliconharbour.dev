name: Check changes
on: pull_request
permissions: {}
concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm test
      - run: pnpm build

  container-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check compressed runtime, native addons, migrations and HTTP
        shell: bash
        run: |
          set -euo pipefail
          data=$(mktemp -d)
          name="siliconharbour-runtime-${GITHUB_RUN_ID}"
          trap 'docker logs "$name" 2>/dev/null || true; docker rm -f "$name" 2>/dev/null || true; sudo rm -rf "$data"' EXIT
          docker build -t siliconharbour-runtime .
          docker run --rm --network none -v "$data:/data" -e DB_URL=/data/smoke.db \
            siliconharbour-runtime node --import tsx scripts/migrate.ts
          docker run -d --name "$name" --network none -v "$data:/data" \
            -e DB_URL=/data/smoke.db -e DATA_DIR=/data -e DB_NAME=smoke.db -e NODE_ENV=production \
            -e SESSION_SECRET=container-test-secret-at-least-thirty-two-bytes \
            -e SITE_URL=http://127.0.0.1:3000 siliconharbour-runtime
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$name" node --input-type=module -e '
              import assert from "node:assert/strict";
              assert.equal(process.config.variables.v8_enable_pointer_compression, 1);
              for (const path of ["/", "/api/events", "/api/companies"]) {
                const response = await fetch("http://127.0.0.1:3000" + path);
                assert.equal(response.status, 200, path);
                assert((await response.text()).length > 0, path);
              }
            '; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          cp -r drizzle "$data/migrations"
          python3 - "$data/migrations" <<'PYFIXTURE'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          journal_path = path / "meta/_journal.json"
          journal = json.loads(journal_path.read_text())
          last = journal["entries"][-1]
          journal["entries"].append({"idx": last["idx"] + 1, "version": "6", "when": last["when"] + 1000, "tag": "9999_online_smoke", "breakpoints": True})
          journal_path.write_text(json.dumps(journal))
          (path / "9999_online_smoke.sql").write_text("CREATE TABLE online_migration_probe(id INTEGER PRIMARY KEY);\n--> statement-breakpoint\nINSERT INTO online_migration_probe VALUES(1);")
          PYFIXTURE
          docker run --rm --network none --volumes-from "$name" \
            -v "$data/migrations:/app/drizzle:ro" -e DB_URL=/data/smoke.db \
            siliconharbour-runtime node --import tsx scripts/migrate.ts --existing --backup-dir /data/backups
          docker exec "$name" node --input-type=module -e '
            import assert from "node:assert/strict";
            import Database from "better-sqlite3";
            import { readdirSync } from "node:fs";
            const db = new Database("/data/smoke.db", { readonly: true });
            assert.equal(db.prepare("SELECT count(*) AS n FROM online_migration_probe").get().n, 1);
            assert.equal(db.pragma("integrity_check", { simple: true }), "ok");
            assert.equal(db.pragma("foreign_key_check").length, 0);
            db.close();
            assert.equal(readdirSync("/data/backups").filter(file => file.endsWith(".sqlite")).length, 1);
            assert.equal((await fetch("http://127.0.0.1:3000/api/events")).status, 200);
          '
