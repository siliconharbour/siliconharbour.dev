name: Verify and publish image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Build test environment
        run: docker build --pull --target development-dependencies-env -t app-tests .
      - name: Lint
        run: docker run --rm app-tests pnpm run lint
      - name: Typecheck (existing debt; diagnostic)
        continue-on-error: true
        run: docker run --rm app-tests pnpm run typecheck
      - name: Tests
        run: docker run --rm app-tests pnpm run test
      - name: Build runtime
        run: docker build --pull -t app-release .
      - name: Verify runtime TLS distrust
        run: docker run --rm -v "$PWD/scripts/check-node-tls.mjs:/check-node-tls.mjs:ro" app-release node /check-node-tls.mjs
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
